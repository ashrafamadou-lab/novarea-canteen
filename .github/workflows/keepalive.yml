name: Supabase keep-alive

# Empêche le projet Supabase (plan gratuit) de se mettre en pause :
# il suffit d'une requête API tous les quelques jours pour le garder actif.
# La clé utilisée est la clé *publishable/anon* (déjà publique dans l'app) — rien de secret ici.

on:
  schedule:
    - cron: '17 7 */3 * *'   # toutes les ~72 h (07:17 UTC). Supabase ne met en pause qu'après ~7 jours d'inactivité.
  workflow_dispatch: {}       # permet aussi un déclenchement manuel depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ooekcxbxxgbllcnzggod.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_e4vGqESZy6df3UZVm9ZiZw_0K4OqJ-K
    steps:
      - name: Ping REST + Auth
        run: |
          set -e
          echo "Auth health:"
          auth=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/auth/v1/health")
          echo "  HTTP ${auth}"

          echo "REST ping:"
          rest=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/meal_services?select=id&limit=1")
          echo "  HTTP ${rest}"

          # 200 (ou 206) = projet actif et joignable. Tout autre code = échec.
          case "${rest}" in
            200|206) echo "✅ Supabase actif." ;;
            *) echo "❌ Réponse inattendue (${rest})"; exit 1 ;;
          esac
