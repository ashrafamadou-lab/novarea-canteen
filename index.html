<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Novarea Canteen Access</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6b2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Canteen Access">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="assets/supabase-config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/tests.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js" defer></script>
<style>
:root{
  --green:#2f8f3e; --green-dark:#1f6b2b; --green-light:#8bc53f; --green-bg:#eaf5ec;
  --ink:#1c2a20; --ink-2:#3a4a3f; --muted:#6b7a70;
  --danger:#c0392b; --danger-bg:#fde8e6; --warn:#b7791f; --warn-bg:#fff4e0;
  --ok:#1f8f4e; --ok-bg:#e7f6ec;
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.86);
  --border:rgba(255,255,255,.65); --border-2:rgba(31,107,43,.14);
  --shadow:0 8px 30px rgba(31,74,42,.12); --shadow-sm:0 3px 12px rgba(31,74,42,.10);
  --radius:18px; --radius-sm:12px;
}
/* ---------- Dark theme (readability first) ---------- */
:root[data-theme="dark"]{
  color-scheme:dark;
  --green:#2f9e44; --green-dark:#8ede98; --green-light:#8bc53f; --green-bg:#16281c;
  --ink:#e9f2ec; --ink-2:#c6d6cb; --muted:#93a99b;
  --danger:#ff8175; --danger-bg:#3a1d19; --warn:#f2b134; --warn-bg:#332810;
  --ok:#63d68f; --ok-bg:#123021;
  --glass:rgba(26,40,31,.82); --glass-strong:rgba(20,32,25,.93);
  --border:rgba(255,255,255,.14); --border-2:rgba(255,255,255,.11);
  --shadow:0 8px 30px rgba(0,0,0,.5); --shadow-sm:0 3px 12px rgba(0,0,0,.42);
}
:root[data-theme="dark"] body{background:linear-gradient(135deg,#0f1a13 0%,#0c1710 45%,#0a140e 100%);background-color:#0c150f;}
:root[data-theme="dark"] body::before{opacity:.26;}
:root[data-theme="dark"] body::after{opacity:.2;}
:root[data-theme="dark"] .mtopbar{background:rgba(16,26,20,.78);}
:root[data-theme="dark"] .sidebar{background:rgba(14,24,18,.82);}
:root[data-theme="dark"] th{background:rgba(20,32,25,.94);}
:root[data-theme="dark"] input,:root[data-theme="dark"] select,:root[data-theme="dark"] textarea{background:rgba(255,255,255,.07);color:var(--ink);}
:root[data-theme="dark"] input::placeholder,:root[data-theme="dark"] textarea::placeholder{color:var(--muted);}
:root[data-theme="dark"] button.secondary{background:rgba(255,255,255,.09);color:var(--ink);}
:root[data-theme="dark"] .pill,:root[data-theme="dark"] .userchip,:root[data-theme="dark"] .lang-toggle{background:rgba(255,255,255,.07);}
:root[data-theme="dark"] .lang-btn{color:var(--ink-2);}
:root[data-theme="dark"] .badge.neutral{background:rgba(255,255,255,.12);color:var(--ink-2);}
:root[data-theme="dark"] #s-dashboard .date-zone input{background:rgba(255,255,255,.07);}
:root[data-theme="dark"] .scan-result.idle{background:rgba(255,255,255,.07);color:var(--muted);}
:root[data-theme="dark"] .toast{background:#08130d;color:var(--ink);border:1px solid var(--border);}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink); min-height:100vh; position:relative; overflow-x:hidden;
  background:linear-gradient(135deg,#eef4ee 0%,#e6f0ea 45%,#e3eee7 100%); background-color:#eaf2ec;
}
body::before,body::after{content:"";position:fixed;z-index:-2;border-radius:50%;filter:blur(70px);opacity:.5;}
body::before{width:520px;height:520px;top:-140px;right:-120px;background:radial-gradient(circle,#8bc53f,#2f8f3e 70%);}
body::after{width:460px;height:460px;bottom:-160px;left:-140px;background:radial-gradient(circle,#2f8f3e,#1f6b2b 70%);opacity:.35;}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.card{background:var(--glass);backdrop-filter:blur(16px) saturate(155%);-webkit-backdrop-filter:blur(16px) saturate(155%);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:18px;margin-bottom:16px;}
.card.solid{background:var(--glass-strong);}
h1,h2,h3,h4{margin:0 0 .5em;color:var(--green-dark);line-height:1.2;}
h1{font-size:1.5rem;font-weight:800;}
h2{font-size:1.25rem;font-weight:700;}
h3{font-size:1.02rem;font-weight:700;}
h4{font-size:.95rem;font-weight:700;}
a{color:var(--green-dark);}
.muted{color:var(--muted);} .small{font-size:.85rem;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.grow{flex:1;}
button,.btn{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:10px 16px;background:var(--green);color:#fff;font-weight:600;box-shadow:var(--shadow-sm);transition:transform .06s ease,filter .15s;}
button:hover,.btn:hover{filter:brightness(1.05);} button:active{transform:translateY(1px);}
button.secondary{background:rgba(255,255,255,.75);color:var(--ink);border:1px solid var(--border-2);}
button.ghost{background:transparent;color:var(--green-dark);box-shadow:none;}
button.danger{background:var(--danger);}
button.small{padding:6px 10px;font-size:.85rem;}
button:disabled{opacity:.5;cursor:not-allowed;}
input,select,textarea{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--border-2);background:rgba(255,255,255,.8);color:var(--ink);width:100%;}
label{display:block;font-size:.82rem;color:var(--ink-2);font-weight:600;margin:8px 0 4px;}
table{width:100%;border-collapse:collapse;font-size:.9rem;}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border-2);}
th{color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);}
.tablewrap{overflow-x:auto;max-height:65vh;overflow-y:auto;border-radius:12px;}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700;}
.badge.ok{background:var(--ok-bg);color:var(--ok);}
.badge.no{background:var(--danger-bg);color:var(--danger);}
.badge.warn{background:var(--warn-bg);color:var(--warn);}
.badge.neutral{background:rgba(0,0,0,.06);color:var(--ink-2);}
.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid var(--border-2);font-size:.8rem;}
.kpi{display:flex;flex-direction:column;gap:2px;min-width:150px;}
.kpi .v{font-size:1.3rem;font-weight:800;color:var(--green-dark);line-height:1.1;word-break:break-word;}
.kpi .l{font-size:.76rem;color:var(--muted);}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
/* Dashboard: more compact zones */
#s-dashboard .card{padding:14px;margin-bottom:12px;}
#s-dashboard .kgrid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px 14px;}
#s-dashboard .kpi .v{font-size:1.15rem;}
#s-dashboard .kpi .l{font-size:.72rem;}
#s-dashboard h2{margin-bottom:0;}
#s-dashboard h3{font-size:.95rem;margin-bottom:8px;}
#s-dashboard .dash-charts{align-items:flex-start;}
#s-dashboard .dash-charts .card{margin-bottom:0;}
#s-dashboard .date-zone{display:inline-flex;align-items:center;gap:8px;background:var(--glass-strong);border:1px solid var(--border-2);border-radius:12px;padding:4px 6px 4px 12px;box-shadow:var(--shadow-sm);margin-top:-4px;}
#s-dashboard .flex-between + .card{margin-top:18px;}
#s-dashboard .date-zone label{margin:0;font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
#s-dashboard .date-zone input{width:auto;padding:6px 8px;font-size:.88rem;border:1px solid var(--border-2);border-radius:8px;background:#fff;}
.bar{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--green-light),var(--green));}
/* ---------- App shell ---------- */
#app{display:none;min-height:100vh;}
#app.on{display:flex;}
.sidebar{width:240px;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:16px 12px;background:rgba(255,255,255,.55);backdrop-filter:blur(20px) saturate(170%);border-right:1px solid var(--border);}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:4px 8px 14px;}
.brand img{height:30px;width:auto;max-width:100%;}
.brand-sub{color:var(--green-dark);font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.82;}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:.92rem;cursor:pointer;}
.nav a:hover{background:rgba(47,143,62,.08);}
.nav a.active{background:var(--green);color:#fff;box-shadow:var(--shadow-sm);}
.nav a .ic{width:20px;text-align:center;}
.sb-foot{border-top:1px solid var(--border-2);padding-top:10px;display:flex;flex-direction:column;gap:8px;}
.userchip{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:6px 8px;border-radius:12px;background:rgba(255,255,255,.6);}
.userchip .av{width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.mtopbar{display:none;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.6);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;}
.content{padding:20px;max-width:1200px;width:100%;margin:0 auto;}
.section{display:none;} .section.on{display:block;animation:fade .2s;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;}}
.sb-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .25s;}
  body.nav-open .sidebar{transform:none;}
  body.nav-open .sb-backdrop{display:block;}
  .mtopbar{display:flex;}
}
/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
#login .box{width:min(400px,100%);padding:28px;}
#login .brand{align-items:center;text-align:center;gap:10px;padding-bottom:4px;}
#login .brand img{height:64px;}
#login .brand-sub{font-size:.82rem;letter-spacing:.18em;}
/* ---------- Modal ---------- */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(20,35,25,.45);backdrop-filter:blur(3px);z-index:100;align-items:center;justify-content:center;padding:16px;}
.modal-bg.on{display:flex;}
.modal{width:min(720px,100%);max-height:88vh;overflow:auto;padding:22px;}
.modal.wide{width:min(960px,100%);}
/* ---------- Scanner ---------- */
#scan-reader{width:100%;max-width:460px;margin:0 auto;border-radius:16px;overflow:hidden;background:#0c130e;aspect-ratio:1/1;}
.scan-result{border-radius:18px;padding:22px;text-align:center;color:#fff;margin-top:14px;transition:.15s;min-height:120px;display:flex;flex-direction:column;justify-content:center;}
.scan-result .big{font-size:1.5rem;font-weight:800;letter-spacing:.02em;}
.scan-result .nm{font-size:1.15rem;font-weight:700;margin-top:6px;}
.scan-result.ok{background:linear-gradient(135deg,#1f8f4e,#146b39);}
.scan-result.no{background:linear-gradient(135deg,#c0392b,#8e2018);}
.scan-result.warn{background:linear-gradient(135deg,#c9821a,#9a6212);}
.scan-result.idle{background:rgba(255,255,255,.6);color:var(--muted);}
.conn-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.conn-online{background:#22a35a;} .conn-offline{background:#c0392b;} .conn-local{background:#b7791f;}
/* ---------- Badge print (portrait ID card) ---------- */
#print-area{position:fixed;left:-9999px;top:0;}
.id-card{width:300px;background:#fff;color:#1c2a20;border:1px solid #d3e2d7;border-radius:16px;overflow:hidden;display:inline-flex;flex-direction:column;vertical-align:top;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.08);}
.id-card .hd{background:linear-gradient(135deg,#2f8f3e,#1f6b2b);color:#fff;padding:11px 14px;display:flex;align-items:center;gap:9px;}
.id-card .hd img{height:26px;width:auto;}
.id-card .hd .co{font-size:.62rem;font-weight:800;letter-spacing:.08em;line-height:1.25;}
.id-card .photo{width:92px;height:92px;border-radius:50%;margin:16px auto 8px;background:#eaf5ec;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:#1f6b2b;border:3px solid #2f8f3e;object-fit:cover;overflow:hidden;}
.id-card .photo img{width:100%;height:100%;object-fit:cover;}
.id-card .nm{text-align:center;font-size:1.08rem;font-weight:800;color:#1f6b2b;padding:0 10px;line-height:1.15;}
.id-card .pos{text-align:center;font-size:.78rem;color:#5a6b60;margin:2px 0 10px;}
.id-card .rows{padding:0 16px;font-size:.72rem;}
.id-card .rows .r{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed #e2ebe4;}
.id-card .rows .r .k{color:#8a9a90;font-weight:600;} .id-card .rows .r .v{font-weight:700;color:#1c2a20;text-align:right;}
.id-card .qrwrap{display:flex;justify-content:center;padding:12px 0 6px;}
.id-card .qrref{text-align:center;font-size:.58rem;color:#9aa89f;letter-spacing:.04em;margin-top:-2px;}
.id-card .cap{display:block;text-align:center;background:#2f8f3e;color:#fff;font-weight:800;font-size:.72rem;letter-spacing:.1em;padding:6px;margin-top:8px;}
.id-card .sig{padding:9px 16px 12px;text-align:center;}
.id-card .sig .line{border-top:1px solid #b9c9bf;margin:0 auto 3px;width:70%;}
.id-card .sig .lbl{font-size:.6rem;color:#8a9a90;letter-spacing:.03em;}
.emp-photo{width:72px;height:72px;border-radius:50%;background:var(--green-bg);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--green-dark);border:2px solid var(--green);overflow:hidden;flex-shrink:0;font-size:1.3rem;}
.emp-photo img{width:100%;height:100%;object-fit:cover;}
@media print{
  body *{visibility:hidden;} #print-area,#print-area *{visibility:visible;}
  #print-area{position:absolute!important;left:0!important;top:0!important;width:100%;}
  #print-area .id-card{page-break-inside:avoid;margin:8px;display:inline-flex!important;}
  body::before,body::after{display:none;}
}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:200;opacity:0;transition:.2s;font-size:.9rem;}
.toast.on{opacity:1;}
.hidden{display:none!important;}
.lang-toggle{display:inline-flex;gap:2px;background:rgba(255,255,255,.6);border:1px solid var(--border-2);border-radius:999px;padding:2px;}
.lang-btn{background:transparent;color:var(--ink-2);border:none;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.8rem;box-shadow:none;cursor:pointer;}
.lang-btn.on{background:var(--green);color:#fff;}
.scale-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
.scale-cap{font-size:.72rem;color:var(--muted);font-weight:600;}
#scale-val{min-width:38px;text-align:center;}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;}
#splash{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--green-bg);}
#splash img{height:64px;width:auto;}
.spin{width:34px;height:34px;border:3px solid rgba(47,143,62,.25);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="splash"><img class="brand-logo" src="assets/logo-novarea.png" alt="Novarea"><div class="spin"></div></div>

<!-- ============================= LOGIN ============================= -->
<div id="login" style="display:none;">
  <div class="box glass">
    <div class="brand">
      <img class="brand-logo" src="assets/logo-novarea.png" alt="Novarea">
      <div class="brand-sub">Canteen Access</div>
    </div>
    <div id="login-msg" class="small" style="color:var(--danger);min-height:18px;"></div>
    <label>Username</label>
    <input id="li-user" autocomplete="username" placeholder="e.g. admin">
    <label>Password</label>
    <input id="li-pass" type="password" autocomplete="current-password" placeholder="••••••••">
    <button style="width:100%;margin-top:16px;" onclick="doLogin()">Sign in</button>
    <div style="text-align:center;margin-top:16px;">
      <span class="lang-toggle">
        <button class="lang-btn" data-lang="fr" onclick="setLang('fr')">FR</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
      </span>
    </div>
    <p class="small muted" id="login-mode" style="margin-top:14px;text-align:center;"></p>
  </div>
</div>

<!-- ============================= APP ============================= -->
<div id="app">
  <div class="sb-backdrop" onclick="closeNav()"></div>
  <aside class="sidebar">
    <div class="brand"><img class="brand-logo" src="assets/logo-novarea.png" alt="Novarea"><div class="brand-sub">Canteen Access</div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sb-foot">
      <div class="userchip"><span class="av" id="uc-av">?</span><div><div id="uc-name" style="font-weight:700;"></div><div class="small muted" id="uc-role"></div></div></div>
      <button class="secondary small" id="installBtn" style="display:none;" onclick="doInstall()">⬇ Install app</button>
      <button class="ghost small" onclick="logout()">⎋ Sign out</button>
    </div>
  </aside>
  <div class="main-col">
    <div class="mtopbar">
      <button class="ghost" onclick="toggleNav()" style="font-size:1.3rem;padding:4px 10px;">☰</button>
      <b id="mtitle" style="color:var(--green-dark);">Dashboard</b>
      <span class="grow"></span>
      <span class="pill"><span class="conn-dot" id="conn-dot2"></span><span id="conn-txt2">Local</span></span>
      <img class="brand-logo" src="assets/logo-novarea.png" alt="Novarea" style="height:22px;">
    </div>
    <div class="content">
      <!-- sections injected/toggled -->
      <section class="section" id="s-dashboard"></section>
      <section class="section" id="s-scanner"></section>
      <section class="section" id="s-employees"></section>
      <section class="section" id="s-badges"></section>
      <section class="section" id="s-imports"></section>
      <section class="section" id="s-reports"></section>
      <section class="section" id="s-settings"></section>
      <section class="section" id="s-users"></section>
      <section class="section" id="s-audit"></section>
      <section class="section" id="s-tests"></section>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-bg"><div class="modal glass" id="modal"></div></div>
<div id="print-area"></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   Novarea Canteen — application controller (local-first + Supabase)
   ===================================================================== */
const CC = window.CanteenCore;
const CLOUD = !!(window.SUPABASE_URL && window.SUPABASE_ANON_KEY);
let SB = null;

/* ---------- tiny helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMoney = n => (Number(n)||0).toLocaleString('fr-FR')+' FCFA';
const todayISO = () => new Date().toISOString().slice(0,10);
const nowISO = () => new Date().toISOString();
function toast(m){const t=$('#toast');t.textContent=(typeof trPhrase==='function'&&trPhrase(m))||m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600);}
function uid(){return (crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2));}
async function sha256(str){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}

const PATTERNS = [
  [/^Meals served \((.+)\)$/, m=>`Repas servis (${m[1]})`],
  [/^Generate (\d+) missing$/, m=>`Générer ${m[1]} manquant(s)`],
  [/^Reason: (.+)$/, m=>`Motif : ${I18N.fr[m[1]]||m[1]}`],
  [/^First passage: (.+)$/, m=>`Premier passage : ${m[1]}`],
  [/^Time: (.+)$/, m=>`Heure : ${m[1]}`],
  [/^(\d+) badges generated\.$/, m=>`${m[1]} badges générés.`],
  [/^Import applied: (\d+) new, (\d+) updated\.$/, m=>`Import appliqué : ${m[1]} nouveaux, ${m[2]} mis à jour.`],
  [/^(\d+) row\(s\) skipped for missing Employee ID\.$/, m=>`${m[1]} ligne(s) ignorée(s) — matricule manquant.`],
  [/^Duplicate IDs in file: (.+)$/, m=>`Matricules en double : ${m[1]}`],
  [/^Delete (.+)\?$/, m=>`Supprimer ${m[1]} ?`],
  [/^❌ Import failed: (.+)$/, m=>`❌ Échec de l'import : ${m[1]}`],
  [/^· (\d+) rows · (\d+) exit IDs$/, m=>`· ${m[1]} lignes · ${m[2]} IDs de sortie`],
  [/^Employees$/, ()=>'Employés']
];
function trPhrase(raw){
  if(LANG!=='fr' || raw==null) return null;
  if(I18N.fr[raw]!==undefined) return I18N.fr[raw];
  for(const [re,fn] of PATTERNS){ const m=raw.match(re); if(m) return fn(m); }
  return null;
}
// Translate rendered DOM to LANG, caching each node's English original so we can toggle both ways.
function translateDOM(root){
  root = root || document.body;
  const walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=>{
    const p=n.parentNode&&n.parentNode.nodeName;
    return (p==='SCRIPT'||p==='STYLE') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
  }});
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    if(n._en===undefined) n._en=n.nodeValue;
    const raw=n._en.trim(); if(!raw) return;
    const fr=trPhrase(raw);
    n.nodeValue = (LANG==='fr'&&fr!=null) ? n._en.replace(raw,fr) : n._en;
  });
  root.querySelectorAll('[placeholder]').forEach(el=>{
    if(el._enPh===undefined) el._enPh=el.getAttribute('placeholder');
    const fr=trPhrase((el._enPh||'').trim());
    el.setAttribute('placeholder', (LANG==='fr'&&fr!=null)?fr:el._enPh);
  });
  root.querySelectorAll('[title]').forEach(el=>{
    if(el._enTitle===undefined) el._enTitle=el.getAttribute('title');
    const fr=trPhrase((el._enTitle||'').trim());
    el.setAttribute('title', (LANG==='fr'&&fr!=null)?fr:el._enTitle);
  });
}

/* ---------- UI text scale (accessibility / density) ---------- */
let UISCALE = parseInt(localStorage.getItem('ntbc_scale')||'100',10);
if(isNaN(UISCALE)) UISCALE=100;
function applyScale(){
  document.documentElement.style.fontSize = (16*UISCALE/100)+'px';
  const el=$('#scale-val'); if(el) el.textContent=UISCALE+'%';
}
function stepScale(d){
  UISCALE=Math.max(75,Math.min(125,UISCALE+d*5));
  localStorage.setItem('ntbc_scale',UISCALE);
  applyScale();
}

/* ---------- Theme (light / dark / auto) ---------- */
let THEME = localStorage.getItem('ntbc_theme')||'auto';
function effectiveTheme(){
  if(THEME==='auto') return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  return THEME;
}
function applyTheme(){
  const eff=effectiveTheme();
  document.documentElement.setAttribute('data-theme', eff);
  const meta=document.querySelector('meta[name="theme-color"]'); if(meta) meta.setAttribute('content', eff==='dark'?'#0c150f':'#1f6b2b');
  $$('.brand-logo').forEach(img=>{ img.src = eff==='dark' ? 'assets/logo-novarea-white.png' : 'assets/logo-novarea.png'; });
  $$('.lang-btn[data-theme]').forEach(b=>b.classList.toggle('on', b.dataset.theme===THEME));
}
function setTheme(t){ THEME=t; localStorage.setItem('ntbc_theme',t); applyTheme(); }
if(window.matchMedia){ try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(THEME==='auto') applyTheme(); }); }catch(e){} }

const KEY = c => 'ntbc_'+c;

function saveLocal(c){ localStorage.setItem(KEY(c),JSON.stringify(state[c])); }
function saveAll(){ COLLS.forEach(saveLocal); }

async function audit(action, entity, entityId, oldV, newV){
  const rec={ id:uid(), userId:SESSION?.userId, userEmail:SESSION?.name, action, entity, entityId:String(entityId||''),
    oldValue:oldV||null, newValue:newV||null, sessionId:SESSION?.sessionId, createdAt:nowISO() };
  if(CLOUD){ try{ await SB.from('audit_log').insert({ user_id:SESSION?.userId, user_email:SESSION?.name, action, entity, entity_id:String(entityId||''), old_value:oldV, new_value:newV, session_id:SESSION?.sessionId }); }catch(e){} }
  else { state.audit.unshift(rec); if(state.audit.length>2000)state.audit.pop(); saveLocal('audit'); }
}

window.addEventListener('DOMContentLoaded', boot);
async function boot(){
  loadLocal();
  setTimeout(()=>{ if(!SESSION) showLogin(); }, 6000);   // safety: never stay stuck on splash
  if(CLOUD && window.supabase){ SB = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY); }
  else if(CLOUD){ // supabase script may still be loading (defer)
    await new Promise(r=>{const t=setInterval(()=>{if(window.supabase){clearInterval(t);r();}},50);setTimeout(r,3000);});
    if(window.supabase) SB = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  }
  $('#login-mode').textContent = CLOUD ? 'Cloud mode (multi-device, server-enforced).'
    : 'Local mode — data stays in this browser. Demo: admin / admin123';
  applyLang();
  applyScale();
  applyTheme();
  updateConn();
  window.addEventListener('online',updateConn); window.addEventListener('offline',updateConn);
  if(!CLOUD){ await seedIfEmpty(); }
  // restore session
  if(CLOUD && SB){
    // Cloud: rely on Supabase's own persisted session (survives PWA relaunch),
    // not sessionStorage. Re-derive the app SESSION from it and reload cloud data.
    try{
      const { data:{ session } } = await SB.auth.getSession();
      if(session && session.user){
        let prof=null;
        try{ const r=await SB.from('profiles').select('*').eq('id',session.user.id).single(); prof=r.data; }catch(e){}
        let cached=null; try{ cached=JSON.parse(localStorage.getItem('ntbc_session')||'null'); }catch(e){}
        SESSION={ userId:session.user.id,
          name:(prof&&prof.full_name)||(cached&&cached.name)||session.user.email,
          role:(prof&&prof.role)||(cached&&cached.role)||'SCANNER', sessionId:uid() };
        localStorage.setItem('ntbc_session',JSON.stringify({userId:SESSION.userId,name:SESSION.name,role:SESSION.role}));
        enterApp();
      }
    }catch(e){}
  } else {
    const raw = localStorage.getItem('ntbc_session');
    if(raw){ try{ SESSION=JSON.parse(raw); enterApp(); }catch(e){} }
  }
  if(!SESSION) showLogin();   // no session restored -> reveal the login form (splash hides)
  // service worker
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); }
  // install prompt
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._deferredPrompt=e;$('#installBtn').style.display='';});
  $('#li-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}
function updateConn(){
  const online=navigator.onLine;
  const cls = CLOUD ? (online?'conn-online':'conn-offline') : 'conn-local';
  const txt = CLOUD ? (online?'Online':'Offline') : 'Local';
  $$('#conn-dot2,.conn-dot').forEach(d=>d.className='conn-dot '+cls);
  $('#conn-txt2') && ($('#conn-txt2').textContent=txt);
}

async function doLogin(){
  const u=$('#li-user').value.trim(), p=$('#li-pass').value;
  $('#login-msg').textContent='';
  if(CLOUD){
    try{
      const {data,error}=await SB.auth.signInWithPassword({email:u,password:p});
      if(error) throw error;
      const {data:prof}=await SB.from('profiles').select('*').eq('id',data.user.id).single();
      SESSION={ userId:data.user.id, name:prof?.full_name||u, role:prof?.role||'SCANNER', sessionId:uid() };
      localStorage.setItem('ntbc_session',JSON.stringify({userId:SESSION.userId,name:SESSION.name,role:SESSION.role}));
      await audit('LOGIN','session',SESSION.userId);
      enterApp();
    }catch(e){ $('#login-msg').textContent='Sign-in failed: '+(e.message||e); }
    return;
  }
  const user=state.users.find(x=>x.username.toLowerCase()===u.toLowerCase());
  if(!user){ $('#login-msg').textContent='Unknown user.'; return; }
  const h=await sha256(p+'::ntbc');

  SESSION={ userId:user.id, name:user.name, role:user.role, sessionId:uid() };
  localStorage.setItem('ntbc_session',JSON.stringify(SESSION));
  await audit('LOGIN','session',user.id);
  enterApp();
}

async function startScanner(){

function onScan(text){
  const now=Date.now();
  if(text===lastToken && now-lastAt<3000) return; // anti-replay debounce
  lastToken=text; lastAt=now;
  processToken(text,'QR');
}
async function processToken(token,method){
  // brief pause during validation
  const b=badgeByToken(token);
  if(!b){ showScanResult('no','INVALID OR REVOKED BADGE',''); beep(false); return; }
  if(b.status!=='ACTIVE'){ showScanResult('no','INVALID OR REVOKED BADGE',''); beep(false); return; }
  await validateAndRecord(b.employeeId, method||'QR');
}
async function validateAndRecord(employeeId, method){
  const e=empById(employeeId);
  if(!e){ showScanResult('no','EMPLOYEE NOT FOUND',employeeId); beep(false); return; }
  const el=CC.computeEligibility(e);
  const svc=activeService();
  const name=`${esc(e.fullName)} — ${esc(e.employeeId)} — ${esc(e.department||'')}`;
  if(!el.eligible){
    showScanResult(el.reasonCode==='NOT_AGENT'?'warn':'no','ACCESS NOT AUTHORIZED', name, 'Reason: '+el.reason);
    await audit('SCAN_DENIED','employee',employeeId,null,{reason:el.reasonCode,method});
    beep(false); return;
  }
  const check=CC.canServeMeal(getMeals(),employeeId,todayISO(),svc.id);
  if(!check.allowed){
    const t=check.firstRecord? new Date(check.firstRecord.scannedAt).toLocaleTimeString('fr-FR'):'';
    showScanResult('no','MEAL ALREADY RECORDED', name, 'First passage: '+t);
    beep(false); return;
  }
  // record
  const price=currentPrice();
  const rec={ id:uid(), employeeId, mealDate:todayISO(), mealServiceId:svc.id, scannedAt:nowISO(),
    scannerUserId:SESSION.userId, scannerSessionId:SCAN_SESSION_ID, scanMethod:method,
    eligibilityStatusAtScan:el.reasonCode, sourceCategoryAtScan:e.sourceCategory, unitPrice:price, currency:'XOF',
    status:'VALID', syncStatus:navigator.onLine?'SYNCED':'PENDING', createdAt:nowISO() };
  let saved=false;
  if(CLOUD){
    try{
      const {error}=await SB.from('meal_records').insert(mapMealToDb(rec));
      if(error){ if((error.message||'').match(/duplicate|unique/i)){ showScanResult('no','MEAL ALREADY RECORDED',name,''); beep(false); return; } throw error; }
      saved=true; state.meals.push(rec);
    }catch(e2){ // offline queue
      rec.syncStatus='PENDING'; state.meals.push(rec); saveLocal('meals'); saved=true;
    }
  } else { state.meals.push(rec); saveLocal('meals'); saved=true; }
  if(saved){
    sessionCount++; $('#scan-count')&&($('#scan-count').textContent=' '+sessionCount);
    showScanResult('ok','MEAL AUTHORIZED', name, 'Time: '+new Date().toLocaleTimeString('fr-FR'));
    beep(true); vibrate();
    await audit('MEAL_SERVED','meal',rec.id,null,{employeeId,method,price});
  }
}

function resizeImage(file,size){
  return new Promise((res,rej)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const c=document.createElement('canvas'); c.width=size;c.height=size; const ctx=c.getContext('2d');
      const s=Math.min(img.naturalWidth,img.naturalHeight); const sx=(img.naturalWidth-s)/2, sy=(img.naturalHeight-s)/2;
      ctx.drawImage(img,sx,sy,s,s,0,0,size,size); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.82)); };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'));}; img.src=url;
  });
}

  const e=empById(id); if(!e)return; e.photo=dataURI;
  if(CLOUD){ const {error}=await SB.from('employees').update({photo:dataURI}).eq('employee_id',id); if(error){ toast('❌ Photo cloud : '+error.message); return; } }
  else saveLocal('employees');

}

async function bulkImportPhotos(files){
  const list=[...files].filter(f=>/^image\//.test(f.type));
  if(!list.length){ toast('Aucune image sélectionnée.'); return; }
  const status=$('#bulk-photo-status');
  let matched=0; const unmatched=[];
  const norm=s=>(s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
  for(let i=0;i<list.length;i++){
    const f=list[i]; const base=f.name.replace(/\.[^.]+$/,'').trim();
    // 1) exact Employee ID  2) filename contains an Employee ID  3) name match
    let e=empById(base);
    if(!e) e=state.employees.find(x=>base.replace(/[^0-9]/g,'')===String(x.employeeId));
    if(!e) e=state.employees.find(x=>String(x.employeeId)&&base.includes(String(x.employeeId)));
    if(!e){ const nb=norm(base); e=state.employees.find(x=>{const nn=norm(x.fullName);return nn&&(nn===nb||nb.includes(nn)||nn.includes(nb));}); }
    if(!e){ unmatched.push(f.name); }
    else{
      try{
        const uri=await resizeImage(f,256); e.photo=uri;
        if(CLOUD){ const {error}=await SB.from('employees').update({photo:uri}).eq('employee_id',e.employeeId); if(error){ unmatched.push(f.name+' (cloud: '+error.message+')'); e.photo=null; } else matched++; }
        else matched++;
      }catch(err){ unmatched.push(f.name+' (image illisible)'); }
    }

let importPreview=null;
function renderImports(){
  $('#s-imports').innerHTML=`

     <input type="file" id="imp-file" accept=".xlsx,.xls" onchange="handleImportFile(event)">

   </div>

async function handleImportFile(ev){
  const file=ev.target.files[0]; if(!file)return;
  $('#imp-status').textContent='Reading workbook…';
  try{
    const buf=await file.arrayBuffer();
    const wb=new ExcelJS.Workbook(); await wb.xlsx.load(buf);
    // build metadata for each sheet (name, header, hidden state, data-row count)
    const sheets=[]; const exitIds=[];
    wb.eachSheet(ws=>{
      const header=[]; const r1=ws.getRow(1);
      r1.eachCell({includeEmpty:true},(c,col)=>{header[col-1]=cellText(c);});
      sheets.push({name:ws.name, ws, headerRow:header, hidden:(ws.state&&ws.state!=='visible'), rows:ws.actualRowCount||ws.rowCount||0});
    });
    // Candidate = has staff headers, NOT hidden, NOT an exit/entries/dashboard helper sheet.
    const isHelper=n=>/exit|entr(y|ies)|dashboard|total|operator|sheet\d+/i.test(n);
    let cands=sheets.filter(s=>CC.isStaffHeader(s.headerRow)&&!s.hidden&&!isHelper(s.name));
    if(!cands.length) cands=sheets.filter(s=>CC.isStaffHeader(s.headerRow)&&!s.hidden);
    if(!cands.length) cands=sheets.filter(s=>CC.isStaffHeader(s.headerRow));
    if(!cands.length){ $('#imp-status').textContent='❌ Could not find an employee sheet (need Employee ID + Staff/ANPE/PSIE headers).'; return; }
    // Among candidates pick the one with the most data rows (the master staff list).
    cands.sort((a,b)=>b.rows-a.rows);
    const staffSheet=cands[0];
    const staff={ name:staffSheet.name, colMap:CC.buildColumnMap(staffSheet.headerRow) };
    // collect exit IDs from any sheet whose name contains "exit"
    sheets.filter(s=>/exit/i.test(s.name)).forEach(s=>{
      const m=CC.buildColumnMap(s.headerRow); if(m.employeeId===undefined)return;
      s.ws.eachRow((row,rn)=>{ if(rn===1)return; const v=row.getCell(m.employeeId+1); const id=cellText(v).trim(); if(id)exitIds.push(id); });
    });
    // parse staff rows
    const incoming=[]; const cmap=staff.colMap;
    staffSheet.ws.eachRow((row,rn)=>{
      if(rn===1)return;
      const vals=[]; row.eachCell({includeEmpty:true},(c,col)=>{vals[col-1]=cellRaw(c);});
      // skip fully empty
      if(!vals.some(v=>v!==undefined&&v!==null&&String(v).trim()!=='')) return;
      incoming.push(CC.parseEmployeeRow(vals,cmap));
    });
    const diff=CC.diffImport(getEmployees(),incoming,exitIds);
    importPreview={ fileName:file.name, sheetName:staff.name, incoming, diff, exitIds };
    $('#imp-status').innerHTML=`✅ Sheet detected: <b>${esc(staff.name)}</b> · ${incoming.length} rows · ${exitIds.length} exit IDs`;
    translateDOM($('#imp-status'));
    renderImportPreview();
  }catch(e){ $('#imp-status').textContent='❌ Import failed: '+(e.message||e); }
}
function cellText(cell){ return cell?String(cell.text??cell.value??'').trim():''; }
function cellRaw(cell){ if(!cell)return ''; let v=cell.value; if(v&&typeof v==='object'){ if(v.text)return v.text; if(v.result!=null)return v.result; if(v instanceof Date)return v.toISOString().slice(0,10); if(v.richText)return v.richText.map(t=>t.text).join(''); } return v; }
function renderImportPreview(){
  const s=importPreview.diff.stats;
  $('#imp-preview').innerHTML=`
   <div class="card solid"><div class="flex-between"><h3 style="margin:0;">Preview — confirm to apply</h3>
     <div class="row"><button class="secondary" onclick="importPreview=null;renderImports();">Cancel</button>
     <button onclick="confirmImport()">✔ Confirm import</button></div></div>
   <div class="kgrid" style="margin-top:12px;">
     ${kpi(s.totalRows,'Rows read')}${kpi(s.newEmployees,'New')}${kpi(s.updated,'Updated')}${kpi(s.unchanged,'Unchanged')}
     ${kpi(s.eligibleAgents,'Eligible Agents')}${kpi(s.newlyEligible,'Newly eligible')}${kpi(s.lostEligibility,'Lost eligibility')}
     ${kpi(s.duplicatesInFile,'Duplicates in file')}${kpi(s.invalidRows,'Invalid rows')}${kpi(s.missingFromImport,'Missing from file')}
   </div>
   ${s.invalidRows?`<p class="small" style="color:var(--warn);margin-top:10px;">${s.invalidRows} row(s) skipped for missing Employee ID.</p>`:''}
   ${s.duplicatesInFile?`<p class="small" style="color:var(--warn);">Duplicate IDs in file: ${importPreview.diff.duplicateIds.slice(0,10).map(esc).join(', ')}${importPreview.diff.duplicateIds.length>10?'…':''}</p>`:''}
   </div>`;
  translateDOM($('#imp-preview'));
}
async function confirmImport(){
  const {diff,fileName}=importPreview;
  const importId=uid();
  // apply atomically to a copy, then commit
  const byId={}; getEmployees().forEach(e=>byId[String(e.employeeId)]=e);
  diff.rows.forEach(r=>{
    const e=r.employee; e.lastImportId=importId; e.missingFromLatestImport=false; e.updatedAt=nowISO();
    recomputeEligibility(e);
    const prev=byId[String(e.employeeId)];
    if(prev){ Object.assign(prev,e); } else { byId[String(e.employeeId)]=e; state.employees.push(e); if(!prev)e.createdAt=nowISO(); }
  });
  // mark missing
  diff.missingIds.forEach(id=>{ const e=byId[String(id)]; if(e)e.missingFromLatestImport=true; });
  const impRec={ id:importId, fileName, stats:diff.stats, createdAt:nowISO() };
  state.imports.unshift(impRec);
  if(CLOUD){
    // NB: supabase-js returns {error} instead of throwing — must check it.
    const rows=diff.rows.map(r=>mapEmpToDb(r.employee, importId));
    const up=await SB.from('employees').upsert(rows,{onConflict:'employee_id'});
    if(up.error){ toast('❌ Écriture cloud échouée : '+up.error.message); importPreview=null; renderImports(); return; }
    await SB.from('employee_imports').insert({file_name:fileName,stats:diff.stats});
    await audit('IMPORT_CONFIRM','import',importId,null,diff.stats);
    importPreview=null;
    await cloudLoadAll();          // resync state from the database
    toast('✅ Import cloud : '+diff.stats.newEmployees+' nouveaux, '+diff.stats.updated+' mis à jour.');
    renderImports();
    return;
  }
  saveLocal('employees'); saveLocal('imports');
  await audit('IMPORT_CONFIRM','import',importId,null,diff.stats);
  toast('Import applied: '+diff.stats.newEmployees+' new, '+diff.stats.updated+' updated.');
  importPreview=null; renderImports();
}

  if(!confirm(msg)) return;
  try{ const regs=await navigator.serviceWorker.getRegistrations(); for(const r of regs) await r.unregister(); }catch(e){}
  try{ for(const k of await caches.keys()) await caches.delete(k); }catch(e){}

       </div>
       <div><label style="margin-top:0;">Theme</label>
         <span class="lang-toggle">
           <button class="lang-btn" data-theme="auto" onclick="setTheme('auto')">Auto</button>
           <button class="lang-btn" data-theme="light" onclick="setTheme('light')">Light</button>
           <button class="lang-btn" data-theme="dark" onclick="setTheme('dark')">Dark</button>
         </span>
       </div>
       <div><label style="margin-top:0;">Install</label>
         <button class="secondary" onclick="doInstall()">⬇ Install app</button>
       </div>
     </div></div>`;
  const adminCards = !isAdmin ? '' : `
   <div class="card"><h3>Meal service</h3><p class="small muted">Lunch is the only meal service served.</p>
     <table><thead><tr><th>Service</th><th>Active</th></tr></thead><tbody>
     ${state.services.map(s=>`<tr><td>${esc(s.label)}</td><td><input type="checkbox" style="width:auto;" ${s.isActive?'checked':''} onchange="toggleService('${s.id}',this.checked)"></td></tr>`).join('')}
     </tbody></table></div>
   <div class="card"><h3>Meal price (versioned)</h3>
     <p class="small muted">Adding a new price keeps the old one for historical reports. Current: <b>${fmtMoney(currentPrice())}</b></p>
     <div class="row">
       <div><label>Amount (FCFA)</label><input type="number" id="pr-amt" value="${currentPrice()}"></div>
       <div><label>Effective from</label><input type="date" id="pr-from" value="${todayISO()}"></div>
       <button style="align-self:flex-end;" onclick="addPrice()">Add price</button>
     </div>
     <div class="tablewrap" style="margin-top:10px;max-height:200px;"><table><thead><tr><th>From</th><th>To</th><th>Amount</th></tr></thead>
       <tbody>${state.prices.slice().sort((a,b)=>b.effectiveFrom.localeCompare(a.effectiveFrom)).map(p=>`<tr><td>${p.effectiveFrom}</td><td>${p.effectiveTo||'—'}</td><td>${fmtMoney(p.amount)}</td></tr>`).join('')}</tbody></table></div>
   </div>
   <div class="card"><h3>Food providers</h3>
     <div class="row"><input id="pv-name" placeholder="Provider name" class="grow"><input id="pv-contact" placeholder="Contact" class="grow"><button onclick="addProvider()">Add</button></div>
     <div class="tablewrap" style="margin-top:10px;"><table><thead><tr><th>Name</th><th>Contact</th><th>Status</th></tr></thead>
       <tbody>${state.providers.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.contact||'')}</td><td>${esc(p.status)}</td></tr>`).join('')||'<tr><td colspan=3 class="muted">None</td></tr>'}</tbody></table></div>
   </div>`;
  $('#s-settings').innerHTML=`<h2>Settings</h2>${prefCard}${dataCard}${adminCards}`;
  $$('#s-settings .lang-btn[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));
  $$('#s-settings .lang-btn[data-theme]').forEach(b=>b.classList.toggle('on',b.dataset.theme===THEME));
}
async function toggleService(id,on){ const s=state.services.find(x=>x.id===id); s.isActive=on; if(CLOUD){try{await SB.from('meal_services').update({is_active:on}).eq('id',id);}catch(e){}} else saveLocal('services'); await audit('SERVICE_TOGGLE','service',id,null,{active:on}); toast('Saved.'); }
async function addPrice(){ const amt=Number($('#pr-amt').value)||0; const from=$('#pr-from').value||todayISO();
  // close previous open price
  state.prices.filter(p=>!p.effectiveTo).forEach(p=>{ const d=new Date(from);d.setDate(d.getDate()-1);p.effectiveTo=d.toISOString().slice(0,10); });
  const rec={id:uid(),amount:amt,currency:'XOF',effectiveFrom:from,effectiveTo:null,changedBy:SESSION.userId,createdAt:nowISO()};
  state.prices.push(rec); if(CLOUD){try{await SB.from('meal_prices').insert({amount:amt,effective_from:from});}catch(e){}} else saveLocal('prices');
  await audit('PRICE_CHANGE','price',rec.id,null,{amount:amt,from}); toast('Price added.'); renderSettings(); }
async function addProvider(){ const name=$('#pv-name').value.trim(); if(!name)return; const rec={id:uid(),name,contact:$('#pv-contact').value.trim(),status:'ACTIVE',createdAt:nowISO()}; state.providers.push(rec); if(CLOUD){try{await SB.from('providers').insert({name:rec.name,contact:rec.contact});}catch(e){}} else saveLocal('providers'); await audit('PROVIDER_ADD','provider',rec.id,null,rec); toast('Provider added.'); renderSettings(); }

/* ===================================================================
   USERS (local mode management)
   =================================================================== */
function renderUsers(){
  if(CLOUD){ $('#s-users').innerHTML=`<h2>Users</h2><div class="card"><p>In cloud mode, create users in the <b>Supabase dashboard</b> (Authentication → Users), then set their role in the <code>profiles</code> table:</p><pre style="background:rgba(0,0,0,.05);padding:10px;border-radius:8px;overflow:auto;">update profiles set role='HR_ADMIN' where email='person@novarea.com';</pre></div>`; return; }
  $('#s-users').innerHTML=`
   <h2>Users</h2>
   <div class="card"><h3>Add user</h3><div class="row">
     <input id="us-user" placeholder="username" class="grow"><input id="us-name" placeholder="full name" class="grow">
     <select id="us-role" style="width:auto;">${Object.keys(ROLES).map(r=>`<option value="${r}">${ROLES[r]}</option>`).join('')}</select>
     <input id="us-pass" placeholder="password" class="grow"><button onclick="addUser()">Add</button>
   </div></div>
   <div class="card"><div class="tablewrap"><table><thead><tr><th>Username</th><th>Name</th><th>Role</th><th></th></tr></thead>
     <tbody>${state.users.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.name)}</td><td>${ROLES[u.role]}</td>
       <td><button class="small secondary" onclick="resetPass('${u.id}')">Reset password</button> ${u.username!=='admin'?`<button class="small danger" onclick="delUser('${u.id}')">Delete</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;
}
async function addUser(){ const u=$('#us-user').value.trim(); if(!u)return; if(state.users.find(x=>x.username===u)){toast('Username exists');return;}
  const rec={id:uid(),username:u,name:$('#us-name').value.trim()||u,role:$('#us-role').value,passHash:await sha256(($('#us-pass').value||'changeme')+'::ntbc')};
  state.users.push(rec); saveLocal('users'); await audit('USER_CREATE','user',rec.id,null,{username:u,role:rec.role}); toast('User added.'); renderUsers(); }
async function resetPass(id){ const p=prompt('New password:'); if(!p)return; const u=state.users.find(x=>x.id===id); u.passHash=await sha256(p+'::ntbc'); saveLocal('users'); await audit('USER_UPDATE','user',id,null,{reset:true}); toast('Password reset.'); }
async function delUser(id){ const u=state.users.find(x=>x.id===id); if(!confirm('Delete '+u.username+'?'))return; state.users=state.users.filter(x=>x.id!==id); saveLocal('users'); await audit('USER_DELETE','user',id,{username:u.username},null); renderUsers(); }

/* ===================================================================
   AUDIT
   =================================================================== */
async function renderAudit(){
  let logs=state.audit||[];
  if(CLOUD){ try{ const {data}=await SB.from('audit_log').select('*').order('created_at',{ascending:false}).limit(300); logs=(data||[]).map(a=>({action:a.action,entity:a.entity,entityId:a.entity_id,userEmail:a.user_email,createdAt:a.created_at,newValue:a.new_value})); }catch(e){} }
  $('#s-audit').innerHTML=`<h2>Audit log</h2>
   <div class="card"><div class="tablewrap"><table><thead><tr><th>When</th><th>User</th><th>Action</th><th>Entity</th><th>Detail</th></tr></thead>
     <tbody>${logs.slice(0,300).map(a=>`<tr><td class="small">${new Date(a.createdAt).toLocaleString()}</td><td>${esc(a.userEmail||'')}</td><td><span class="badge neutral">${esc(a.action)}</span></td><td class="small">${esc(a.entity||'')} ${esc(a.entityId||'')}</td><td class="small muted">${esc(JSON.stringify(a.newValue||a.oldValue||'').slice(0,80))}</td></tr>`).join('')||'<tr><td colspan=5 class="muted">No events.</td></tr>'}</tbody></table></div></div>`;
}

/* ===================================================================
   TESTS
   =================================================================== */
function renderTests(){
  $('#s-tests').innerHTML=`<h2>Automated tests</h2>
   <div class="card"><p class="small muted">Runs the real unit tests (eligibility, one-meal rule, billing, import mapping) in this browser.</p>
     <button onclick="runTests()">▶ Run tests</button><div id="test-out" style="margin-top:14px;"></div></div>`;
}
function runTests(){
  const r=window.CanteenTests.run();
  $('#test-out').innerHTML=`<div class="kgrid"><div class="kpi"><span class="v" style="color:${r.failed?'var(--danger)':'var(--ok)'}">${r.passed}/${r.total}</span><span class="l">passed</span></div>${r.failed?`<div class="kpi"><span class="v" style="color:var(--danger)">${r.failed}</span><span class="l">failed</span></div>`:''}</div>
   <div class="tablewrap" style="margin-top:12px;"><table><thead><tr><th></th><th>Test</th><th>Detail</th></tr></thead>
   <tbody>${r.results.map(t=>`<tr><td>${t.pass?'<span class="badge ok">PASS</span>':'<span class="badge no">FAIL</span>'}</td><td>${esc(t.name)}</td><td class="small muted">${t.pass?'':esc(t.detail)}</td></tr>`).join('')}</tbody></table></div>`;
  translateDOM($('#test-out'));
}

/* ===================================================================
   CLOUD helpers (mappers + load)
   =================================================================== */
function _dOrNull(v){ v=v==null?'':String(v); const m=v.match(/^\d{4}-\d{2}-\d{2}/); return m?v.slice(0,10):null; }
function mapEmpToDb(e,importId){ return {
  employee_id:String(e.employeeId), full_name:e.fullName||String(e.employeeId),
  department:e.department||null, position:e.position||null, gender:e.gender||null,
  source_category:e.sourceCategory||null, employment_status:e.employmentStatus||'Active',
  joining_date:_dOrNull(e.joiningDate), contract_type:e.contractType||null,
  contract_start:_dOrNull(e.contractStart), contract_end:_dOrNull(e.contractEnd),
  access_override:e.accessOverride||'AUTO', is_eligible:!!e.isEligible,
  eligibility_reason:e.eligibilityReason||null, missing_from_latest_import:!!e.missingFromLatestImport,
  last_import_id:null }; }
function mapEmpFromDb(r){ return { employeeId:r.employee_id, fullName:r.full_name, department:r.department, position:r.position, gender:r.gender, sourceCategory:r.source_category, employmentStatus:r.employment_status, joiningDate:r.joining_date, contractType:r.contract_type, contractStart:r.contract_start, contractEnd:r.contract_end, accessOverride:r.access_override, isEligible:r.is_eligible, eligibilityReason:r.eligibility_reason, missingFromLatestImport:r.missing_from_latest_import, photo:r.photo||null, valid:true }; }
function mapMealToDb(m){ return { employee_id:m.employeeId, meal_date:m.mealDate, meal_service_id:m.mealServiceId, scanned_at:m.scannedAt, scanner_user_id:m.scannerUserId, scanner_session_id:m.scannerSessionId, scan_method:m.scanMethod, eligibility_status_at_scan:m.eligibilityStatusAtScan, source_category_at_scan:m.sourceCategoryAtScan, unit_price_at_scan:m.unitPrice, status:m.status }; }
function mapMealFromDb(r){ return { id:r.id, employeeId:r.employee_id, mealDate:r.meal_date, mealServiceId:r.meal_service_id, scannedAt:r.scanned_at, scannerUserId:r.scanner_user_id, scanMethod:r.scan_method, eligibilityStatusAtScan:r.eligibility_status_at_scan, sourceCategoryAtScan:r.source_category_at_scan, unitPrice:r.unit_price_at_scan, status:r.status, cancelReason:r.cancel_reason }; }
let _mealChannel=null;
async function cloudLoadAll(){
  try{
    const [emps,badges,meals,services,prices,providers]=await Promise.all([
      SB.from('employees').select('*'), SB.from('badges').select('*'),
      SB.from('meal_records').select('*').gte('meal_date',new Date(Date.now()-60*864e5).toISOString().slice(0,10)),
      SB.from('meal_services').select('*'), SB.from('meal_prices').select('*'), SB.from('providers').select('*')
    ]);
    state.employees=(emps.data||[]).map(mapEmpFromDb);
    state.badges=(badges.data||[]).map(b=>({id:b.id,employeeId:b.employee_id,token:b.token,displayTokenReference:b.display_token_reference,status:b.status,issuedAt:b.issued_at,revokedAt:b.revoked_at}));
    state.meals=(meals.data||[]).map(mapMealFromDb);
    if(services.data&&services.data.length) state.services=services.data.map(s=>({id:s.id,label:s.label,isActive:s.is_active}));
    state.prices=(prices.data||[]).map(p=>({id:p.id,amount:p.amount,currency:p.currency,effectiveFrom:p.effective_from,effectiveTo:p.effective_to}));
    state.providers=(providers.data||[]).map(p=>({id:p.id,name:p.name,contact:p.contact,status:p.status}));
    if(CURRENT) showSection(CURRENT);
  }catch(e){ toast('Cloud load failed: '+(e.message||e)); }
  // realtime meals — subscribe ONCE, in its own guarded block so a realtime
  // hiccup never breaks the data load or shows an error toast.
  try{
    if(!_mealChannel){
      _mealChannel = SB.channel('meals')
        .on('postgres_changes',{event:'*',schema:'public',table:'meal_records'}, ()=>{
          SB.from('meal_records').select('*').gte('meal_date',todayISO()).then(({data})=>{
            if(data){ const others=state.meals.filter(m=>m.mealDate<todayISO()); state.meals=others.concat(data.map(mapMealFromDb)); if(CURRENT==='dashboard')renderDashboard(); }
          });
        })
        .subscribe();
    }
  }catch(e){ /* realtime optional */ }
}

/* ---------- modal + install ---------- */
function openModal(html,cls){ $('#modal').className='modal glass'+(cls?' '+cls:''); $('#modal').innerHTML=html; $('#modal-bg').classList.add('on'); translateDOM($('#modal')); }
function closeModal(){ $('#modal-bg').classList.remove('on'); }
$('#modal-bg').addEventListener('click',e=>{ if(e.target.id==='modal-bg')closeModal(); });
async function doInstall(){
  if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches){ toast('App already installed.'); return; }
  const p=window._deferredPrompt;
  if(p){ p.prompt(); await p.userChoice; window._deferredPrompt=null; const b=$('#installBtn'); if(b) b.style.display='none'; return; }
  // No native prompt available -> show clear per-platform steps.
  openModal(`<h3>Install the app</h3>
    <p class="small">Android (Chrome): open the browser menu (⋮, top right) and tap "Install app".</p>
    <p class="small">iPhone (Safari): tap the Share button and "Add to Home Screen".</p>
    <p class="small">Computer (Chrome/Edge): click the install icon at the right of the address bar.</p>
    <p class="small muted">If you don't see the option, the app is probably already installed.</p>
    <div class="row" style="justify-content:flex-end;margin-top:12px;"><button onclick="closeModal()">OK</button></div>`);
}
